<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Detail | StudyNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="blogger-body">
    <div class="page-shell single-post-wrap">
      <main class="content-area single-post-area">
        <header class="site-banner detail-banner">
          <div class="banner-topbar">
            <div class="brand-name">StudyNest</div>
            <a href="/" class="back-link">← Home</a>
          </div>
        </header>

        <article id="blog-detail" class="detail-article"></article>

        <section class="comment-panel" id="comments">
          <h3>Comments</h3>
          <div id="comment-list" class="comment-list"></div>

          <form id="comment-form" class="comment-form">
            <div class="form-row">
              <input type="text" id="comment-name" placeholder="Name" required />
            </div>
            <div class="form-row">
              <textarea id="comment-text" rows="4" placeholder="Write a comment..." required></textarea>
            </div>
            <button type="submit">Post Comment</button>
          </form>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/blog.js"></script>
  </body>
</html>
