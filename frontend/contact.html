<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | EduLift</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container container-main">
        <nav class="navbar navbar-expand-lg px-0 py-3 nav-wrap">
          <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <span class="brand-mark">E</span>
            <span class="brand-name">EduLift</span>
          </a>
          <div class="collapse navbar-collapse show">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="/blog.html?id=blog-1">Blogs</a></li>
              <li class="nav-item"><a class="nav-link" href="/about.html">About</a></li>
              <li class="nav-item"><a class="nav-link active" href="/contact.html">Contact</a></li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <main class="section-wrap">
      <div class="container container-main">
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="contact-card p-4 h-100">
              <h1 class="section-title">Let’s connect</h1>
              <p>We would love to hear from students, contributors, and communities building better learning experiences.</p>
              <ul class="list-unstyled mt-4">
                <li><strong>Email:</strong> hello@edulift.example</li>
                <li><strong>Phone:</strong> +91 99999 99999</li>
                <li><strong>Location:</strong> Bengaluru, India</li>
              </ul>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="contact-card p-4">
              <form>
                <div class="mb-3">
                  <label class="form-label" for="contact-name">Name</label>
                  <input id="contact-name" class="form-control" type="text" placeholder="Your name" />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="contact-email">Email</label>
                  <input id="contact-email" class="form-control" type="email" placeholder="Your email" />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="contact-message">Message</label>
                  <textarea id="contact-message" class="form-control" rows="5" placeholder="Write your message..."></textarea>
                </div>
                <button type="button" class="btn btn-primary">Send message</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container container-main text-center">
        © <span id="year"></span> EduLift. All rights reserved.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
